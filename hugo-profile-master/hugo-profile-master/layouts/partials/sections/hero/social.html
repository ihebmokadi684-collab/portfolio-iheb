<div class="hero-social-links" role="group" aria-label="Réseaux sociaux">
    {{ range .Site.Params.hero.socialLinks.fontAwesomeIcons }}
    <span class="px-1">
        <a href="{{ .url }}"
            {{ if not (hasPrefix .url "#") }} target="_blank" rel="noopener noreferrer" {{ end }}
            class="btn social-icon"
            aria-label="{{ .name | default .url }}"
        >
            <i class="{{ .icon }}" aria-hidden="true"></i>
        </a>
    </span>
    {{ end }}

    {{ range .Site.Params.hero.socialLinks.customIcons }}
    <span class="px-1">
        <a href="{{ .url }}"
            {{ if not (hasPrefix .url "#") }} target="_blank" rel="noopener noreferrer" {{ end }}
            class="btn social-icon"
            aria-label="{{ .name | default .url }}"
        >
            <img src="{{ .icon }}" alt="">
        </a>
    </span>
    {{ end }}
</div>
