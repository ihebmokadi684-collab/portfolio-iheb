baseURL: "https://hugo-profile.netlify.app"
languageCode: "fr-fr"
title: "Iheb Mokadi | Business Intelligence & Full-Stack Developer"
theme: hugo-profile
defaultContentLanguage: "fr"
defaultContentLanguageInSubdir: false
staticDir:
  - "static"
  - "../images"

outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML
    - RSS

enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
