  description: "Portfolio d'Iheb Mokadi, développeur Business Intelligence et Full-Stack Junior."
  favicon: "/fav.png"
  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:
    defaultTheme: "light"

  navbar:
    align: ms-auto
    brandName: "Iheb Mokadi"
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  hero:
    enable: true
    intro: "Bonjour, je m'appelle"
    title: "Iheb Mokadi."
    subtitle: "Business Intelligence | Développeur Full-Stack Junior"
    content: "Jeune diplômé en Licence Informatique Appliquée à la Gestion, spécialité Business Intelligence, passionné par le développement web, l'analyse de données et les nouvelles technologies."
