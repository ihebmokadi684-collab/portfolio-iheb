    title: "À propos de moi"
    image: "/images/me.png"
    content: |-
      Jeune diplômé en Licence Informatique Appliquée à la Gestion, spécialité Business Intelligence à la FSEG Nabeul. Curieux, autonome et créatif, je souhaite intégrer une entreprise innovante afin de mettre en pratique mes compétences techniques et participer au développement de solutions performantes.

      Basé à Ariana, en Tunisie, je m'intéresse particulièrement au développement d'applications web, à l'analyse de données et à la conception de solutions utiles et fiables.
    skills:
      enable: true
      title: "Technologies et compétences techniques :"
      items:
        - "Java"
        - "Python"
        - "JavaScript"
        - "HTML5 / CSS3"
        - "C"
        - "Pascal"
        - "React.js"
        - "Symfony"
        - "Spring Boot"
        - "MySQL"
        - "Git / GitHub"

